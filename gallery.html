<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Bob Zheng art gallery">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
    <style>
        @media (max-width: 600px) {
            body > div:first-child {
                padding: 1rem;
            }

            table {
                width: 100% !important;
                table-layout: auto !important;
            }

            table td {
                display: block;
                width: 100% !important;
                box-sizing: border-box;
                padding: 0.75rem 0 !important;
            }

            table tr {
                display: block;
            }

            table tr:first-child td img {
                width: auto !important;
                max-width: 100%;
                margin: 0 auto;
            }

            body > div:last-child {
                display: flex !important;
                flex-wrap: wrap;
                justify-content: center;
                gap: 0.75rem;
                margin: 1rem 0 2rem !important;
            }

            body > div:last-child button {
                margin: 0;
            }
        }
    </style>
</head>
<body style="margin: 0; min-height: 100vh; background-image: url('bg_image.jpg'); background-size: cover; background-position: center; background-repeat: no-repeat; background-attachment: fixed; color: #fff;">
    <div style="background: rgba(0, 0, 0, 0.35); min-height: 100vh; padding: 1in; box-sizing: border-box;">
        <h1 style="font-weight: bold; text-align: center; color: #fff;">Gallery</h1>
        <table style="width: 80%; margin: 0 auto; border-collapse: collapse; table-layout: fixed;">
            <tr>
                <td style="width: 33.33%; padding: .5%; vertical-align: top;"><a href="landscape.html"><img src="landscape.jpg" alt="Landscape" style="display: block; width: 100%; height: auto;"></a></td>
                <td style="width: 33.33%; padding: .5%; vertical-align: top;"><a href="portrait.html"><img src="portrait.jpg" alt="Portrait" style="display: block; width: 70%; height: auto; margin: 0 auto;"></a></td>
                <td style="width: 33.33%; padding: .5%; vertical-align: top;"><a href="still_life.html"><img src="still_life.jpg" alt="Still life" style="display: block; width: 100%; height: auto;"></a></td>
            </tr>
        </table>
    </div>
    <div style="display: block; text-align: center; margin-top: 20px; margin-bottom: 1in;">
        <button type="button" onclick="window.location.href='index.html'" style="display: inline-block; margin: 0 10px; padding: 10px 20px; border: none; border-radius: 8px; background: #d9d9d9; color: #000; font-size: 1rem; cursor: pointer; text-decoration: none;">Home</button>
        <button type="button" onclick="window.location.href='gallery.html'" style="display: inline-block; margin: 0 10px; padding: 10px 20px; border: none; border-radius: 8px; background: #ffffff; color: #000; font-size: 1rem; cursor: pointer; text-decoration: none;">Gallery</button>
        <button type="button" onclick="window.location.href='contact.html'" style="display: inline-block; margin: 0 10px; padding: 10px 20px; border: none; border-radius: 8px; background: #f0f0f0; color: #000; font-size: 1rem; cursor: pointer; text-decoration: none;">Contact</button>
    </div>
</body>
</html>
